<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sound Canvas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="sr-only">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>Sound Canvas</h1>
      <p data-testid="intro">
        An instrument you paint. A ripple loops out from the centre, and every tap sends out
        another — each one plays whatever sound marks it touches.
      </p>
    </header>
    <main>
      <canvas
        id="sound-canvas"
        aria-label="Sound canvas. Tap or click anywhere to send out a ripple of sound."
      ></canvas>

      <div class="transport" role="group" aria-label="Transport">
        <button
          type="button"
          id="pause-btn"
          class="pause-btn"
          aria-pressed="false"
          aria-label="Pause automatic loop"
        >
          <span class="pause-icon" aria-hidden="true"></span>
        </button>
        <label for="tempo-slider" class="sr-only">Tempo</label>
        <input id="tempo-slider" type="range" min="0" max="100" value="25" />

        <div class="clear-control" id="clear-control">
          <button type="button" class="clear-btn" aria-label="Clear canvas: remove all painted sounds">
            <span class="clear-icon" aria-hidden="true"></span>
          </button>
          <div class="clear-confirm" hidden>
            <span class="clear-confirm-label">Clear all?</span>
            <button type="button" class="clear-confirm-action confirm">Confirm</button>
            <button type="button" class="clear-confirm-action cancel">Cancel</button>
          </div>
        </div>
      </div>

      <div class="palette" role="group" aria-label="Sound brushes and tools">
        <button
          type="button"
          class="brush-btn brush-bell"
          data-brush="bell"
          aria-pressed="false"
          aria-label="Bell brush: clear, bright, crystalline sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-crystal"
          data-brush="crystal"
          aria-pressed="false"
          aria-label="Crystal brush: glassy, resonant sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-drop"
          data-brush="drop"
          aria-pressed="false"
          aria-label="Drop brush: soft water-drop sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-deep"
          data-brush="deep"
          aria-pressed="false"
          aria-label="Deep Synth brush: deep, warm, atmospheric sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-metal"
          data-brush="metal"
          aria-pressed="false"
          aria-label="Metal brush: distant resonant metallic sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-shimmer"
          data-brush="shimmer"
          aria-pressed="false"
          aria-label="Shimmer brush: airy, high, slowly emerging sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn tool-eraser"
          data-tool="eraser"
          aria-pressed="false"
          aria-label="Eraser: remove a painted sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
