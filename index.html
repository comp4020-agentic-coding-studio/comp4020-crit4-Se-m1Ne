<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DREAMWASH</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="sr-only">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>DREAMWASH</h1>
      <p data-testid="intro">
        An instrument you paint. A ripple loops out from the centre, and every tap sends out
        another — each one plays whatever sound marks it touches.
      </p>
    </header>
    <main>
      <canvas
        id="sound-canvas"
        aria-label="Sound canvas. Tap or click anywhere to send out a ripple of sound."
      ></canvas>

      <div class="transport" role="group" aria-label="Transport" inert>
        <button
          type="button"
          id="pause-btn"
          class="pause-btn"
          aria-pressed="false"
          aria-label="Pause automatic loop"
        >
          <span class="pause-icon" aria-hidden="true"></span>
        </button>
        <label for="tempo-slider" class="sr-only">Tempo</label>
        <input id="tempo-slider" type="range" min="0" max="100" value="25" />

        <div class="clear-control" id="clear-control">
          <button type="button" class="clear-btn" aria-label="Clear canvas: remove all painted sounds">
            <span class="clear-icon" aria-hidden="true"></span>
          </button>
          <div class="clear-confirm" hidden>
            <span class="clear-confirm-label">Clear all?</span>
            <button type="button" class="clear-confirm-action confirm">Confirm</button>
            <button type="button" class="clear-confirm-action cancel">Cancel</button>
          </div>
        </div>
      </div>

      <div class="palette" role="group" aria-label="Sound brushes and tools" inert>
        <button
          type="button"
          class="brush-btn brush-bell"
          data-brush="bell"
          aria-pressed="false"
          aria-label="Bell brush: clear, bright, crystalline sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-glass"
          data-brush="glass"
          aria-pressed="false"
          aria-label="Glass brush: transparent, soft, dreamlike sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-pluck"
          data-brush="pluck"
          aria-pressed="false"
          aria-label="Soft Pluck brush: gentle, rounded, warm sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-bloom"
          data-brush="bloom"
          aria-pressed="false"
          aria-label="Bloom brush: warm sound that slowly opens and fades"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-haze"
          data-brush="haze"
          aria-pressed="false"
          aria-label="Haze brush: very soft, washed-out, floating sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-deep"
          data-brush="deep"
          aria-pressed="false"
          aria-label="Deep brush: low, warm, atmospheric sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-shimmer"
          data-brush="shimmer"
          aria-pressed="false"
          aria-label="Shimmer brush: airy, high, slowly emerging sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn brush-veil"
          data-brush="veil"
          aria-pressed="false"
          aria-label="Veil brush: distant, hollow, wordless floating sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="brush-btn tool-eraser"
          data-tool="eraser"
          aria-pressed="false"
          aria-label="Eraser: remove a painted sound"
        >
          <span class="brush-icon" aria-hidden="true"></span>
        </button>
      </div>

      <div
        id="wake-cover"
        class="wake-cover"
        role="button"
        tabindex="0"
        aria-label="Touch to resonate and wake the instrument"
      >
        <div class="wake-cover-text">
          <p class="wake-cover-title">DREAMWASH</p>
          <p class="wake-cover-hint">touch to resonate</p>
        </div>
      </div>
      <div class="wake-cover-wave" aria-hidden="true"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
